name: pauln10v_rick_and_morty_api
description: "REST API client lib for https://rickandmortyapi.com/"
version: 0.0.3
# pub.dev wants at least one of these; an empty `homepage:` is not valid.
repository: https://github.com/<your-account>/<your-repo>

environment:
  sdk: ^3.13.5

dependencies:
  http: ^1.6.0 # dart.dev
  http_parser: ^4.1.2 # dart.dev
  json_annotation: ^4.12.0 # google.dev
  freezed_annotation: ^3.1.0
  extension_type_unions: ^1.0.10 # https://github.com/eernstg/extension_type_unions
  problem_details: ^0.0.2 # https://github.com/bytes7bytes7/problem_details/blob/master/resources/l10n/ru_RU/README.md

dev_dependencies:
  test: ^1.25.0
  lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.14.0
  build_runner: ^2.15.0